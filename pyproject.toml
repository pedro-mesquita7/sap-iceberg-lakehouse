[project]
name = "sap-iceberg-lakehouse"
version = "0.1.0"
description = "SAP Order-to-Cash data into an Apache Iceberg lakehouse: CDC extraction, dbt models with contracts, Dagster orchestration"
readme = "README.md"
license = "MIT"
authors = [{ name = "Pedro Mesquita" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyiceberg[sql-sqlite,pyarrow,pyiceberg-core]>=0.12",
    "fsspec>=2024.1",
    "dbt-core>=1.11,<1.12",
    "dbt-duckdb>=1.11,<1.12",
    "dagster>=1.11",
    "dagster-dbt>=0.27",
    "dagster-webserver>=1.11",
]

[project.scripts]
sap-lakehouse = "sap_lakehouse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sap_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.dagster]
module_name = "sap_lakehouse.orchestration.definitions"
code_location_name = "sap_lakehouse"
