name: sap_lakehouse
version: "1.0.0"
profile: sap_lakehouse

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

# The iceberg plugin loads each bronze source into this schema. Creating it up front avoids
# parallel threads racing to create it on a fresh database (DuckDB write-write conflict).
on-run-start:
  - "create schema if not exists bronze"

models:
  sap_lakehouse:
    staging:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
      +contract:
        enforced: true

seeds:
  sap_lakehouse:
    +schema: reference
